{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>徕可管理系统 · 登录</title>
    <link rel="icon" href="{% static 'images/maneu/logo.svg' %}">
    <link rel="stylesheet" href="{% static 'css/maneu/login.css' %}">
    <link crossorigin="anonymous"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/cerulean/bootstrap.min.css"
          integrity="sha512-3n/Isj9MCqCc1wf/QfjLigco9sx9xr9m3TqgxstJrSxmwZ05qjl4owbfkioZ0y3w8fNWcVLnJGHfVqKF/L1Qsw=="
          referrerpolicy="no-referrer" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"></script>
</head>
<body>

<div class="tech-bg"></div>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>

<div class="main-content">
    <div class="login-card">
        <h1 class="brand-name">徕可管理系统</h1>
        <p class="brand-sub">Account Login</p>

        <div class="input-group-custom">
            <input autocomplete="off" class="input-item" id="call" placeholder="手机号码" type="tel" maxlength="11">
            <span class="msg" id="msg"></span>
        </div>

        <div class="input-group-custom" id="password">
            <input autocomplete="off" class="input-item" id="code" placeholder="验证码" type="text" maxlength="6">
            <span class="msg" id="login_msg"></span>
        </div>

        <button class="btn-custom btn-disabled" id="login-hold" style="display: none;">请输入验证码后再登录</button>
        <button class="btn-custom btn-gold" id="login-btn" style="display: none;">登录</button>

        <button class="btn-custom btn-outline-light" id="sendsms-btn">获取验证码</button>
        <button class="btn-custom btn-disabled" id="wait-btn" style="display: none;">60秒后可重试</button>

        <a href="{% url 'index' %}" class="back-link">返回首页</a>
    </div>
</div>

<footer class="footer">
    <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">粤ICP备2023070483号</a>
</footer>

<script>
    // ========================================================================
    // 1. 工具函数
    // ========================================================================

    function isValidPhone(phone) {
        return /^1[3-9]\d{9}$/.test(phone);
    }

    function showMessage(text, color = '#ff6b6b') {
        $('#msg').text(text).css('color', color);
    }
    function showLoginMessage(text, color = '#ff6b6b') {
        $('#login_msg').text(text).css('color', color);
    }

    // ========================================================================
    // 2. API 端点（由 Django 模板反向解析）
    // ========================================================================

    const sendsmsUrl = "{% url 'sendsms' %}";
    const loginApiUrl = "{% url 'access_token' %}";
    const redirectUrl = "{% url 'maneu_order:index' %}";

    // ========================================================================
    // 3. 页面初始化
    // ========================================================================

    $(document).ready(function () {
        const $call = $('#call');
        const $code = $('#code');
        const $sendsmsBtn = $('#sendsms-btn');
        const $waitBtn = $('#wait-btn');
        const $loginHold = $('#login-hold');
        const $loginBtn = $('#login-btn');

        let countdownTimer = null;
        let countdownSeconds = 0;

        // ====================================================================
        // 4. 登录按钮状态控制
        // ====================================================================

        function toggleLoginButton() {
            if ($code.val().trim() === '') {
                $loginHold.show();
                $loginBtn.hide();
            } else {
                $loginHold.hide();
                $loginBtn.show();
            }
        }

        toggleLoginButton();
        $code.on('input', toggleLoginButton);

        // ====================================================================
        // 5. 验证码倒计时
        // ====================================================================

        function startCountdown(seconds) {
            if (countdownTimer) clearInterval(countdownTimer);
            countdownSeconds = seconds;
            $sendsmsBtn.hide();
            $waitBtn.show().text(`${countdownSeconds}秒后可重试`);

            countdownTimer = setInterval(function () {
                countdownSeconds--;
                if (countdownSeconds <= 0) {
                    clearInterval(countdownTimer);
                    $waitBtn.hide();
                    $sendsmsBtn.show().prop('disabled', false);
                } else {
                    $waitBtn.text(`${countdownSeconds}秒后可重试`);
                }
            }, 1000);
        }

        // ====================================================================
        // 6. 发送验证码（JSON）
        // ====================================================================

        $sendsmsBtn.on('click', function () {
            const phone = $call.val().trim();

            if (!phone) {
                showMessage('请输入手机号码');
                return;
            }
            if (!isValidPhone(phone)) {
                showMessage('手机号格式不正确');
                return;
            }

            $sendsmsBtn.prop('disabled', true);

            $.ajax({
                url: sendsmsUrl,
                method: 'POST',
                contentType: 'application/json',                 // ✅ 新增
                data: JSON.stringify({ call: phone }),           // ✅ 改
                dataType: 'json',
                success: function (res) {
                    if (res && res.status === true) {
                        showMessage('验证码已发送', '#4caf50');
                        startCountdown(60);
                    } else {
                        showMessage((res && res.message) || '发送失败');
                        $sendsmsBtn.prop('disabled', false);
                    }
                },
                error: function (xhr) {
                    const errMsg = (xhr.responseJSON && xhr.responseJSON.message) || '网络错误，请稍后重试';
                    showMessage(errMsg);
                    $sendsmsBtn.prop('disabled', false);
                }
            });
        });

        // ====================================================================
        // 7. 登录（JSON）
        // ====================================================================

        $loginBtn.on('click', function () {
            const phone = $call.val().trim();
            const code = $code.val().trim();

            if (!phone || !code) {
                showMessage('请填写手机号和验证码');
                return;
            }
            if (!isValidPhone(phone)) {
                showMessage('手机号格式不正确');
                return;
            }

            $loginBtn.prop('disabled', true).text('登录中...');

            $.ajax({
                url: loginApiUrl,
                method: 'POST',
                contentType: 'application/json',                              // ✅ 新增
                data: JSON.stringify({ call: phone, code: code }),            // ✅ 改
                dataType: 'json',
                success: function (res) {
                    if (res && res.status === true) {
                        const data = res.content || {};
                        if (data.access_token)  localStorage.setItem('access_token',  data.access_token);
                        if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
                        window.location.href = redirectUrl;
                    } else {
                        showLoginMessage((res && res.message) || '登录失败');
                        $loginBtn.prop('disabled', false).text('登录');
                    }
                },
                error: function (xhr) {
                    let errMsg = '登录请求失败，请稍后重试';
                    try {
                        const d = JSON.parse(xhr.responseText);
                        errMsg = d.message || errMsg;
                    } catch (e) {}
                    showLoginMessage(errMsg);
                    $loginBtn.prop('disabled', false).text('登录');
                }
            });
        });
    });
</script>
</body>
<script>
    // ========================================================================
    // API 端点（Django 反向解析）
    // ========================================================================
    const sendsmsUrl  = "{% url 'sendsms' %}";
    const loginApiUrl = "{% url 'test_login' %}";
    const refreshUrl  = "{% url 'refresh_token' %}";
    const redirectUrl = "{% url 'maneu_order:index' %}";

</script>

<script src="{% static 'javascript/maneu/login.js' %}"></script>
</html>
