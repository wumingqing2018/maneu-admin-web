{% extends 'maneu/base.html' %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/store_insert_20261024.css' %}">
{% endblock %}

{% block content %}
    <div class="main-content-wrapper">
        <div class="page-header">
            <h1 class="page-title">
                <i class="bi bi-plus-circle-dotted"></i> 新增定制记录
            </h1>
            <a href="{% url 'maneu_store:index' %}" class="btn-back">
                <i class="bi bi-arrow-left"></i> 返回列表
            </a>
        </div>

        <div class="section-card" id="guestSection">
            <div class="section-title">
                <span><i class="bi bi-person-vcard"></i> 客户信息</span>
            </div>

            <div class="row g-3 mb-2">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                        <input type="datetime-local" class="form-control" id="time">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input autocomplete="off" type="text" class="form-control" id="name" placeholder="客户姓名（选填）">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input autocomplete="off" type="text" class="form-control" id="phone" placeholder="联系电话（选填）">
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-12">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-chat-left-text"></i></span>
                        <input autocomplete="off" type="text" class="form-control" id="remark" placeholder="备注信息（选填）">
                    </div>
                </div>
            </div>
        </div>

        <div class="section-card" id="storeSection">
            <div class="section-title d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span><i class="bi bi-box-seam"></i> 定制产品信息</span>
                <div class="d-flex gap-2">
                    <button class="btn-toggle" id="toggleProduct" type="button">
                        <i class="bi bi-chevron-down"></i> 详细参数
                    </button>
                </div>
            </div>

            <div class="col-md-6" id="productExtra">
                <div class="kv-row"><input type="text" class="kv-key" id="key1" placeholder="参数名" value="产品系列"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val1" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key2" placeholder="参数名" value="产品名称"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val2" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key3" placeholder="参数名" value="折射率"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val3" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key4" placeholder="参数名" value="膜层"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val4" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key5" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val5" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key6" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val6" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key7" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val7" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key8" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val8" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key9" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val9" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key10" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val10" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key11" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val11" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key12" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val12" placeholder="参数值"></div>
                <small class="text-muted d-block mt-2">
                    <i class="bi bi-info-circle"></i> 填写自定义产品参数，参数名不能重复，留空则不保存。
                </small>
            </div>
        </div>

        <div class="action-bar justify-content-end">
            <button class="btn btn-outline-primary btn-back-page" id="submitOrderBtn" type="button">
                <i class="bi bi-check-lg"></i> 提交订单
            </button>
        </div>
    </div>
{% endblock %}

{% block javascript %}
    <script>
        window.STORE_INSERT_API = "{% url 'maneu_store:api_insert' %}";
        window.STORE_LIST_URL   = "{% url 'maneu_store:index' %}";
    </script>
    <script>
        (function () {
            function val(id) {
                return ($('#' + id).val() || '').trim();
            }

            function getToken() {
                return localStorage.getItem('access_token') || '';
            }

            function showError(msg) {
                alert(msg || '操作失败，请稍后重试');
            }

            function getNowForDatetimeLocal() {
                var d = new Date();
                var pad = function (n) { return String(n).padStart(2, '0'); };
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                    'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            }

            function setupToggle(btnId, panelId) {
                var $btn = $('#' + btnId);
                var $panel = $('#' + panelId);
                if (!$btn.length || !$panel.length) return;

                $btn.on('click', function () {
                    $panel.slideToggle(200);
                    $btn.find('i').toggleClass('bi-chevron-down bi-chevron-up');
                });
            }

            function collectStoreContent() {
                var keys = [];
                var obj = {};

                for (var i = 1; i <= 12; i++) {
                    var key = val('key' + i);
                    var v   = val('val' + i);

                    if (!key) continue;

                    if (keys.indexOf(key) !== -1) {
                        showError('产品参数名「' + key + '」重复，请修改后再提交');
                        return null;
                    }

                    keys.push(key);
                    obj[key] = v;
                }

                if (keys.length === 0) {
                    showError('请至少填写一组产品参数');
                    return null;
                }

                return JSON.stringify([obj]);
            }

            var isSubmitting = false;

            function submitOrder() {
                if (isSubmitting) return;

                var storeContent = collectStoreContent();
                if (storeContent === null) return;

                var payload = {
                    time:         val('time'),
                    name:         val('name'),
                    phone:        val('phone'),
                    remark:       val('remark'),
                    storeContent: storeContent,
                };

                var token = getToken();
                if (!token) {
                    alert('请先登录');
                    return;
                }

                var $btn = $('#submitOrderBtn');
                var originalText = $btn.html();

                isSubmitting = true;
                $btn.prop('disabled', true)
                    .html('<span class="spinner-border spinner-border-sm me-1"></span>提交中...');

                // 统一使用全局包装：401 自动刷新 token 并重放
                window.apiRequest({
                    url: window.STORE_INSERT_API,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    dataType: 'json'
                })
                .done(function (res) {
                    if (res && res.status === true) {
                        alert('提交成功');
                        location.href = window.STORE_LIST_URL || '/';
                    } else if (res && res.errors) {
                        var msgs = [];
                        Object.keys(res.errors).forEach(function (k) {
                            (res.errors[k] || []).forEach(function (e) {
                                msgs.push(e.message);
                            });
                        });
                        showError(msgs.length ? msgs.join('\n') : (res.message || '提交失败'));
                    } else {
                        showError((res && res.message) || '提交失败');
                    }
                })
                .fail(function (xhr) {
                    if (xhr.status === 401) return;   // 全局已处理跳转登录
                    var msg = '网络错误，请稍后重试';
                    try {
                        var data = JSON.parse(xhr.responseText);
                        msg = data.message || msg;
                    } catch (e) {}
                    showError(msg);
                })
                .always(function () {
                    isSubmitting = false;
                    $btn.prop('disabled', false).html(originalText);
                });
            }

            $(function () {
                $('#time').val(getNowForDatetimeLocal());
                setupToggle('toggleProduct', 'productExtra');
                $('#submitOrderBtn').on('click', submitOrder);

                $('#guestSection input, #storeSection input').on('keypress', function (e) {
                    if (e.which === 13) {
                        e.preventDefault();
                        submitOrder();
                    }
                });
            });
        })();
    </script>
{% endblock %}
