{% extends 'maneu/base.html' %}
{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/maneu_store/detail20261024.css' %}">
{% endblock %}

{% block content %}
    <div class="main-content-wrapper">
        <div class="page-header">
            <h1 class="page-title">
                <i class="bi bi-gear-wide-connected"></i> 定制记录详情
            </h1>
            <div class="d-flex gap-2 flex-wrap">
                <button class="btn-qrcode" id="generateQrCode" type="button">
                    <i class="bi bi-qr-code"></i> 二维码
                </button>
                <a href="{% url 'maneu_store:index' %}" class="btn-back">
                    <i class="bi bi-arrow-left"></i> 返回列表
                </a>
            </div>
        </div>

        <div class="section-card" id="guestSection">
            <div class="section-title">
                <span>
                    <i class="bi bi-person-vcard"></i> 客户信息
                    <span class="status-badge status-empty ms-2" id="guestLoadStatus">加载中...</span>
                </span>
            </div>

            <div class="row g-3 mb-2">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                        <input type="datetime-local" class="form-control" id="time">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input autocomplete="off" type="text" class="form-control" id="name" placeholder="客户姓名（选填）">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input autocomplete="off" type="text" class="form-control" id="phone" placeholder="联系电话（选填）">
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-12">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-chat-left-text"></i></span>
                        <input autocomplete="off" type="text" class="form-control" id="remark" placeholder="备注信息（选填）">
                    </div>
                </div>
            </div>
        </div>

        <div class="section-card" id="storeSection">
            <div class="section-title">
                <span>
                    <i class="bi bi-box-seam"></i> 定制记录信息
                    <span class="status-badge status-empty ms-2" id="storeLoadStatus">加载中...</span>
                </span>
            </div>

            <div class="col-md-6" id="productExtra">
                <div class="kv-row"><input type="text" class="kv-key" id="key1" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val1" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key2" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val2" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key3" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val3" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key4" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val4" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key5" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val5" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key6" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val6" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key7" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val7" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key8" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val8" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key9" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val9" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key10" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val10" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key11" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val11" placeholder="参数值"></div>
                <div class="kv-row"><input type="text" class="kv-key" id="key12" placeholder="参数名"><span class="kv-sep">:</span><input type="text" class="kv-val" id="val12" placeholder="参数值"></div>
                <small class="text-muted d-block mt-2">
                    <i class="bi bi-info-circle"></i> 填写12组自定义产品参数，参数名不能重复，留空则不保存。
                </small>
            </div>

            <div class="action-bar justify-content-end">
                <button class="btn-save" id="storeUpdate" type="button">
                    <i class="bi bi-check-lg"></i> 更新产品信息
                </button>
            </div>
        </div>

        <div class="action-bar justify-content-end">
            <button class="btn-delete-record" id="deleteOrder" type="button">
                <i class="bi bi-trash3"></i> 删除此记录
            </button>
        </div>
    </div>
{% endblock %}

{% block javascript %}
    <script>
        window.PAGE_URLS = {
            api_detail: "{% url 'maneu_store:api_detail' %}",
            api_update: "{% url 'maneu_store:api_update' %}",
            api_delete: "{% url 'maneu_store:api_delete' %}",
            api_qrcode: "{% url 'maneu_store:api_QRcode' %}",
            web_index:  "{% url 'maneu_store:index' %}",
        };
    </script>

    <script>
        (function () {
            'use strict';

            // ====================================================================
            // 1. 常量
            // ====================================================================

            var INDEX_ID = sessionStorage.getItem('current_id') || '';

            // ====================================================================
            // 2. 工具函数
            // ====================================================================

            function val(target) {
                var $el = (typeof target === 'string') ? $('#' + target) : target;
                return ($el.val() || '').trim();
            }

            function formatTimeForInput(timeStr) {
                if (!timeStr) return '';
                return String(timeStr).replace(' ', 'T').substring(0, 16);
            }

            function showError(msg) {
                alert(msg || '操作失败，请稍后重试');
            }

            function setSubmitting($btn, state) {
                if (!$btn || !$btn.length) return;
                if (state) {
                    $btn.prop('disabled', true).data('original-text', $btn.html());
                    $btn.html('<span class="spinner-border spinner-border-sm me-1"></span>处理中...');
                } else {
                    $btn.prop('disabled', false);
                    if ($btn.data('original-text')) $btn.html($btn.data('original-text'));
                }
            }

            function setLoadStatus($el, status, message) {
                $el.removeClass('status-empty status-loaded status-warning');
                if (status === 'loading') {
                    $el.addClass('status-empty').text(message || '加载中...');
                } else if (status === 'success') {
                    $el.addClass('status-loaded').text(message || '已加载');
                } else {
                    $el.addClass('status-warning').text(message || '加载失败');
                }
            }

            // ====================================================================
            // 3. 渲染
            // ====================================================================

            function renderDetail(data) {
                $('#time').val(formatTimeForInput(data.time));
                $('#name').val(data.name || '');
                $('#phone').val(data.phone || '');
                $('#remark').val(data.remark || '');
                setLoadStatus($('#guestLoadStatus'), 'success', '已加载');

                var raw = data.content;
                var obj = {};

                if (Array.isArray(raw)) {
                    obj = raw[0] || {};
                } else if (raw && typeof raw === 'object') {
                    obj = raw;
                }

                for (var i = 1; i <= 12; i++) {
                    $('#key' + i).val('');
                    $('#val' + i).val('');
                }

                var keys = Object.keys(obj).slice(0, 12);
                keys.forEach(function (key, idx) {
                    var n = idx + 1;
                    $('#key' + n).val(key);
                    $('#val' + n).val(obj[key]);
                });

                setLoadStatus($('#storeLoadStatus'), 'success', '已加载');
            }

            // ====================================================================
            // 4. 加载详情
            // ====================================================================

            var currentRequest = null;

            function loadDetail() {
                if (currentRequest && currentRequest.readyState !== 4) {
                    currentRequest.abort();
                }

                setLoadStatus($('#guestLoadStatus'), 'loading');
                setLoadStatus($('#storeLoadStatus'), 'loading');

                currentRequest = window.requestJSON(window.PAGE_URLS.api_detail, {
                    index_id: INDEX_ID
                })
                    .done(function (res) {
                        if (!res || res.status !== true) {
                            setLoadStatus($('#guestLoadStatus'), 'error', (res && res.message) || '加载失败');
                            setLoadStatus($('#storeLoadStatus'), 'error', '加载失败');
                            return;
                        }

                        var storeWrapper = res.content && res.content.store;
                        if (!storeWrapper || !storeWrapper.ok) {
                            setLoadStatus($('#guestLoadStatus'), 'error', '记录不存在');
                            setLoadStatus($('#storeLoadStatus'), 'error', '记录不存在');
                            return;
                        }

                        renderDetail(storeWrapper.data || {});
                    })
                    .fail(function (xhr, status) {
                        if (status === 'abort') return;
                        if (xhr.status === 401) return;
                        if (xhr.status === 404) {
                            setLoadStatus($('#guestLoadStatus'), 'error', '记录不存在');
                            setLoadStatus($('#storeLoadStatus'), 'error', '记录不存在');
                        } else {
                            setLoadStatus($('#guestLoadStatus'), 'error', '加载失败');
                            setLoadStatus($('#storeLoadStatus'), 'error', '加载失败');
                        }
                    });
            }

            // ====================================================================
            // 5. 更新
            // ====================================================================

            function doUpdate(payload, $btn, confirmMsg, successMsg) {
                if ($btn.prop('disabled')) return;
                if (!confirm(confirmMsg || '确定要更新吗？')) return;

                setSubmitting($btn, true);
                var data = $.extend({ index_id: INDEX_ID }, payload);

                window.requestJSON(window.PAGE_URLS.api_update, data)
                    .done(function (res) {
                        if (res && res.status === true) {
                            alert(successMsg || '更新成功');
                            loadDetail();
                        } else {
                            var msgs = [];
                            if (res && res.errors) {
                                Object.keys(res.errors).forEach(function (k) {
                                    (res.errors[k] || []).forEach(function (e) {
                                        if (e && e.message) msgs.push('• ' + e.message);
                                    });
                                });
                            }
                            showError(msgs.length ? msgs.join('\n') : ((res && res.message) || '更新失败'));
                        }
                    })
                    .fail(function (xhr) {
                        if (xhr.status === 401) return;
                        showError('网络错误，请稍后重试');
                    })
                    .always(function () {
                        setSubmitting($btn, false);
                    });
            }

            function collectStoreContent() {
                var keys = [];
                var obj = {};

                for (var i = 1; i <= 12; i++) {
                    var key = val('key' + i);
                    var v = val('val' + i);

                    if (!key) continue;

                    if (keys.indexOf(key) !== -1) {
                        showError('产品参数名「' + key + '」重复，请修改后再提交');
                        return null;
                    }

                    keys.push(key);
                    obj[key] = v;
                }

                return JSON.stringify([obj]);
            }

            function saveAll() {
                var storeContent = collectStoreContent();
                if (storeContent === null) return;

                doUpdate(
                    {
                        time: val('time'),
                        name: val('name'),
                        phone: val('phone'),
                        remark: val('remark'),
                        storeContent: storeContent
                    },
                    $('#storeUpdate'),
                    '确定要保存所有修改吗？',
                    '保存成功'
                );
            }

            // ====================================================================
            // 6. 删除
            // ====================================================================

            function deleteRecord() {
                if (!confirm('确定要删除这条记录吗？此操作不可恢复。')) return;

                var $btn = $('#deleteOrder');
                if ($btn.prop('disabled')) return;
                setSubmitting($btn, true);

                window.requestJSON(window.PAGE_URLS.api_delete, { index_id: INDEX_ID })
                    .done(function (res) {
                        if (res && res.status === true) {
                            alert('删除成功');
                            location.replace(window.PAGE_URLS.web_index);
                        } else {
                            showError((res && res.message) || '删除失败');
                        }
                    })
                    .fail(function (xhr) {
                        if (xhr.status === 401) return;
                        showError('网络错误，请稍后重试');
                    })
                    .always(function () {
                        setSubmitting($btn, false);
                    });
            }

            // ====================================================================
            // 7. 二维码下载
            // ====================================================================

            function downloadQRCode() {
                var $btn = $('#generateQrCode');
                if ($btn.prop('disabled')) return;
                setSubmitting($btn, true);

                window.apiRequest({
                    url: window.PAGE_URLS.api_qrcode,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ index_id: INDEX_ID }),
                    xhrFields: { responseType: 'blob' }
                })
                    .done(function (blob) {
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = INDEX_ID + '.png';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    })
                    .fail(function (xhr) {
                        if (xhr.status === 401) return;
                        if (xhr.response instanceof Blob) {
                            var reader = new FileReader();
                            reader.onload = function () {
                                try {
                                    var data = JSON.parse(reader.result || '{}');
                                    showError(data.message || '二维码生成失败');
                                } catch (e) {
                                    showError('二维码生成失败，请稍后重试');
                                }
                            };
                            reader.readAsText(xhr.response);
                        } else {
                            showError('二维码生成失败，请稍后重试');
                        }
                    })
                    .always(function () {
                        setSubmitting($btn, false);
                    });
            }

            // ====================================================================
            // 8. 初始化
            // ====================================================================

            $(function () {
                if (!INDEX_ID) {
                    alert('缺少记录 ID，请从列表页进入');
                    location.replace(window.PAGE_URLS.web_index || '/');
                    return;
                }

                $('#storeUpdate').on('click', saveAll);
                $('#deleteOrder').on('click', deleteRecord);
                $('#generateQrCode').on('click', downloadQRCode);

                loadDetail();
            });

        })();
    </script>
{% endblock %}
