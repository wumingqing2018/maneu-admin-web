{% extends 'maneu/base.html' %}
{% load static %}

{% block css %}
    <link href="{% static 'css/store_index_20260606.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
    <div class="main-content-wrapper">
        <div class="page-header">
            <h1 class="page-title">
                <i class="bi bi-gear-wide-connected"></i> 定制记录
            </h1>
            <a href="{% url 'maneu_store:insert' %}" class="btn-add-record">
                <i class="bi bi-plus-lg"></i> 新增记录
            </a>
        </div>

        <div class="filter-card">
            <div class="filter-group">
                <label><i class="bi bi-search"></i> 客户信息</label>
                <div class="input-group input-group-sm">
                    <input class="form-control" id="keywordInput" placeholder="姓名或手机号码" type="text">
                    <button class="btn btn-primary" id="searchByText" type="button">
                        <i class="bi bi-search"></i> 查询
                    </button>
                </div>
                <div class="invalid-feedback" style="display: none;">请输入搜索关键词</div>
            </div>
            <div class="filter-group">
                <label><i class="bi bi-calendar-range"></i> 时间范围</label>
                <div class="input-group input-group-sm">
                    <span class="input-group-text">从</span>
                    <input autocomplete="off" class="form-control" id="timeStart" type="datetime-local"
                           min="2010-01-01T00:00">
                    <span class="input-group-text">至</span>
                    <input autocomplete="off" class="form-control" id="timeEnd" type="datetime-local"
                           min="2010-01-01T00:00">
                    <button class="btn btn-primary" id="searchByTime" type="button">
                        <i class="bi bi-funnel"></i> 筛选
                    </button>
                </div>
            </div>
        </div>

        <div class="list-header d-none d-md-flex">
            <div class="col-time">录入时间</div>
            <div class="col-name">客户姓名</div>
            <div class="col-phone">联系电话</div>
            <div class="col-remark">订单备注</div>
            <div class="col-actions">操作</div>
        </div>

        <div id="listContainer">
            <div class="loading-spinner">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block javascript %}
    <script>
        window.PAGE_URLS = {
            web_detail:     "{% url 'maneu_store:detail' %}",
            api_delete:     "{% url 'maneu_store:api_delete' %}",
            api_searchText: "{% url 'maneu_store:api_search_data' %}",
            api_searchTime: "{% url 'maneu_store:api_search_time' %}",
        };
    </script>

    <script>
        (function () {
            'use strict';

            // ====================================================================
            // 1. 工具函数
            // ====================================================================

            function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                return String(str).replace(/[&<>"']/g, function (m) {
                    if (m === '&')  return '&amp;';
                    if (m === '<')  return '&lt;';
                    if (m === '>')  return '&gt;';
                    if (m === '"')  return '&quot;';
                    if (m === "'")  return '&#39;';
                    return m;
                });
            }

            function toLocalDatetime(date) {
                var tzOffset = date.getTimezoneOffset() * 60000;
                return new Date(date.getTime() - tzOffset).toISOString().slice(0, 16);
            }

            function formatTimeDisplay(timeStr) {
                if (!timeStr) return '-';
                return String(timeStr).replace('T', ' ').substring(0, 16);
            }

            function showError(msg) {
                alert(msg || '操作失败，请稍后重试');
            }

            // ====================================================================
            // 2. DOM 缓存
            // ====================================================================

            var $listContainer = $('#listContainer');
            var $keyword       = $('#keywordInput');
            var $timeStart     = $('#timeStart');
            var $timeEnd       = $('#timeEnd');
            var $searchTextBtn = $('#searchByText');
            var $searchTimeBtn = $('#searchByTime');

            var currentRequest = null;

            // ====================================================================
            // 3. UI 状态
            // ====================================================================

            function showLoading() {
                $listContainer.html(
                    '<div class="loading-spinner">' +
                    '  <div class="spinner-border text-primary" role="status"></div>' +
                    '</div>'
                );
            }

            function showEmptyState() {
                $listContainer.html(
                    '<div class="empty-state">' +
                    '  <i class="bi bi-inbox"></i>' +
                    '  <p>暂无记录</p>' +
                    '  <small>尝试调整筛选条件或新增一条记录</small>' +
                    '</div>'
                );
            }

            function showErrorState(msg) {
                $listContainer.html(
                    '<div class="empty-state">' +
                    '  <i class="bi bi-exclamation-triangle"></i>' +
                    '  <p>' + escapeHtml(msg || '加载失败，请稍后重试') + '</p>' +
                    '</div>'
                );
            }

            function clearKeywordInvalid() {
                $keyword.removeClass('is-invalid');
                $keyword.closest('.filter-group').find('.invalid-feedback').hide();
            }

            function showKeywordInvalid() {
                $keyword.addClass('is-invalid');
                $keyword.closest('.filter-group').find('.invalid-feedback').show();
            }

            // ====================================================================
            // 4. 列表渲染
            // ====================================================================

            function createItemHTML(item) {
                var time   = formatTimeDisplay(item.time);
                var name   = escapeHtml(item.name)   || '-';
                var phone  = escapeHtml(item.phone)  || '-';
                var remark = escapeHtml(item.remark) || '-';
                var id     = escapeHtml(item.id);

                return '' +
                    '<div class="store-list-item">' +
                    '  <div class="col-time">' +
                    '    <i class="bi bi-clock me-2 d-md-none"></i>' +
                    '    ' + escapeHtml(time) +
                    '  </div>' +
                    '  <div class="col-name">' +
                    '    <i class="bi bi-person me-2 d-md-none"></i>' +
                    '    ' + name +
                    '  </div>' +
                    '  <div class="col-phone">' +
                    '    <i class="bi bi-phone me-2 d-md-none"></i>' +
                    '    ' + phone +
                    '  </div>' +
                    '  <div class="col-remark" title="' + remark + '">' +
                    '    <i class="bi bi-chat-left-text me-2 d-md-none"></i>' +
                    '    ' + remark +
                    '  </div>' +
                    '  <div class="col-actions">' +
                    '    <button class="btn-action detail-btn" data-index-id="' + id + '" title="查看详情">' +
                    '      <i class="bi bi-eye"></i>' +
                    '    </button>' +
                    '    <button class="btn-action delete-btn" data-index-id="' + id + '" title="删除记录">' +
                    '      <i class="bi bi-trash3"></i>' +
                    '    </button>' +
                    '  </div>' +
                    '</div>';
            }

            function renderList(items) {
                $listContainer.empty();

                if (!Array.isArray(items) || items.length === 0) {
                    showEmptyState();
                    return;
                }

                var $frag = $(document.createDocumentFragment());
                items.forEach(function (item) {
                    $frag.append(createItemHTML(item));
                });
                $listContainer.append($frag);
            }

            // ====================================================================
            // 5. 业务操作
            // ====================================================================

            function handleDetail(btn) {
                var indexId = btn.getAttribute('data-index-id');
                if (!indexId) return;

                sessionStorage.setItem('current_id', indexId);
                window.location.href = window.PAGE_URLS.web_detail;
            }

            function deleteRecord(btn) {
                if (!confirm('确定要删除这条记录吗？此操作不可恢复。')) return;

                var indexId = btn.getAttribute('data-index-id');

                window.requestJSON(window.PAGE_URLS.api_delete, { index_id: indexId })
                    .done(function (res) {
                        if (res && res.status === true) {
                            var $item = $(btn).closest('.store-list-item');
                            $item.css({
                                transition: 'all 0.3s ease',
                                opacity: 0,
                                transform: 'translateX(20px)',
                            });
                            setTimeout(function () {
                                $item.remove();
                                if (!$listContainer.find('.store-list-item').length) {
                                    showEmptyState();
                                }
                            }, 300);
                        } else {
                            showError((res && res.message) || '删除失败，请稍后重试');
                        }
                    })
                    .fail(function (xhr) {
                        if (xhr.status === 401) return;
                        showError('网络错误，请稍后重试');
                    });
            }

            // ====================================================================
            // 6. 数据加载
            // ====================================================================

            function fetchAndRender(url, params) {
                if (currentRequest && currentRequest.readyState !== 4) {
                    currentRequest.abort();
                }

                showLoading();

                currentRequest = window.requestJSON(url, params)
                    .done(function (res) {
                        var data = (res && Array.isArray(res.content)) ? res.content : [];
                        renderList(data);
                    })
                    .fail(function (xhr, status) {
                        if (status === 'abort') return;
                        var msg = '加载失败，请稍后重试';
                        try {
                            var data = JSON.parse(xhr.responseText);
                            msg = data.message || msg;
                        } catch (e) {}
                        showErrorState(msg);
                    });
            }

            // ====================================================================
            // 7. 搜索
            // ====================================================================

            function searchByTime() {
                clearKeywordInvalid();

                var timeS = $timeStart.val();
                var timeE = $timeEnd.val();

                if (!timeS || !timeE) {
                    showError('请选择完整的时间范围');
                    return;
                }

                if (timeS > timeE) {
                    showError('开始时间不能晚于结束时间');
                    return;
                }

                fetchAndRender(window.PAGE_URLS.api_searchTime, {
                    timeS: timeS,
                    timeE: timeE,
                });
            }

            function searchByText() {
                var keyword = $keyword.val().trim();
                if (!keyword) {
                    showKeywordInvalid();
                    return;
                }
                clearKeywordInvalid();
                fetchAndRender(window.PAGE_URLS.api_searchText, { value: keyword });
            }

            // ====================================================================
            // 8. 初始化
            // ====================================================================

            $(function () {
                var now = new Date();

                if (!$timeStart.val()) {
                    var start = new Date(now.getTime());
                    start.setDate(start.getDate() - 7);
                    start.setHours(0, 0, 0, 0);
                    $timeStart.val(toLocalDatetime(start));
                }

                if (!$timeEnd.val()) {
                    var end = new Date(now.getTime());
                    end.setHours(23, 59, 0, 0);
                    $timeEnd.val(toLocalDatetime(end));
                }

                var maxEnd = new Date(now.getTime());
                maxEnd.setHours(23, 59, 0, 0);
                var maxDatetime = toLocalDatetime(maxEnd);
                $timeStart.attr('max', maxDatetime);
                $timeEnd.attr('max', maxDatetime);

                searchByTime();

                $searchTextBtn.on('click', searchByText);
                $searchTimeBtn.on('click', searchByTime);

                $keyword.on('keypress', function (e) {
                    if (e.which === 13) {
                        e.preventDefault();
                        searchByText();
                    }
                });

                $listContainer.on('click', '.detail-btn', function () {
                    handleDetail(this);
                });
                $listContainer.on('click', '.delete-btn', function () {
                    deleteRecord(this);
                });
            });

        })();
    </script>
{% endblock %}
